<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Kitchen — Savor</title>
    <link rel="stylesheet" href="../assets/css/site.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="../home.html">
            <span class="brand-mark">🌿</span>
            Savor
        </a>
        <nav class="site-nav">
            <a href="../home.html">Home</a>
            <a href="../recipes.html">Recipes</a>
            <a href="../profile/proflie.html" data-account-link>My kitchen</a>
        </nav>
    </header>

    <main class="page-shell">
        <div class="profile-layout">
            <div class="profile-summary">
                <div class="profile-avatar" data-profile-avatar>SC</div>
                <h2 data-profile-name>Guest cook</h2>
                <p data-profile-email>Add an email to your profile</p>
                <div class="profile-stat" data-favorite-count>0 saved recipes</div>
                <div class="profile-actions">
                    <button class="button button-light" style="width:100%" data-sign-out>Sign out</button>
                </div>
            </div>

            <div class="profile-panel">
                <h2>Edit profile</h2>
                <p>Update your display name and email address.</p>
                <form data-profile-form>
                    <div class="form-grid">
                        <div class="form-field">
                            <label for="name">Name</label>
                            <input class="form-control" id="name" name="name" type="text" required autocomplete="name">
                        </div>
                        <div class="form-field">
                            <label for="email">Email</label>
                            <input class="form-control" id="email" name="email" type="email" autocomplete="email">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button class="button" type="submit">Save changes</button>
                        <p class="form-message" data-form-message></p>
                    </div>
                </form>
            </div>
        </div>

        <section class="section">
            <div class="section-heading">
                <div>
                    <h2>Saved recipes</h2>
                    <p data-favorite-count>0 saved recipes</p>
                </div>
                <a class="text-link" href="../recipes.html">Browse all →</a>
            </div>
            <div class="recipe-grid" data-recipe-grid data-favorites="true"></div>
        </section>
    </main>

    <footer class="site-footer">
        <p>© 2026 Savor · Made with ❤️ for healthy eating</p>
    </footer>

    <dialog class="dialog" id="recipe-dialog"></dialog>
    <script src="../assets/js/app.js"></script>
</body>
</html>
