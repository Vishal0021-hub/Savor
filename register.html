<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Savor</title>
    <link rel="stylesheet" href="./assets/css/site.css">
</head>
<body>
    <div class="auth-layout">
        <div class="auth-intro">
            <a class="brand" href="./home.html">
                <span class="brand-mark">🌿</span>
                Savor
            </a>
            <div class="auth-intro-copy">
                <h1>Your kitchen, your recipes.</h1>
                <p>Create an account to save favourites and share your own creations with the community.</p>
            </div>
            <small>Free forever. No credit card needed.</small>
        </div>

        <div class="auth-main">
            <div class="auth-card">
                <h2>Create account</h2>
                <p>Join the Savor community today.</p>
                <form data-register-form>
                    <div class="form-field">
                        <label for="name">Full name</label>
                        <input class="form-control" id="name" name="name" type="text" placeholder="Your name" required autocomplete="name">
                    </div>
                    <div class="form-field">
                        <label for="email">Email</label>
                        <input class="form-control" id="email" name="email" type="email" placeholder="you@example.com" required autocomplete="email">
                    </div>
                    <div class="form-field">
                        <label for="password">Password</label>
                        <input class="form-control" id="password" name="password" type="password" placeholder="Choose a password" required autocomplete="new-password">
                    </div>
                    <div class="form-field">
                        <label for="confirmPassword">Confirm password</label>
                        <input class="form-control" id="confirmPassword" name="confirmPassword" type="password" placeholder="Repeat password" required autocomplete="new-password">
                    </div>
                    <button class="button" type="submit">Create account</button>
                    <p class="form-message" data-form-message></p>
                </form>
                <p class="auth-switch">Already have an account? <a href="./index.html">Sign in</a></p>
            </div>
        </div>
    </div>

    <script src="./assets/js/app.js"></script>
</body>
</html>
