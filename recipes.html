<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes — Savor</title>
    <link rel="stylesheet" href="./assets/css/site.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="./home.html">
            <span class="brand-mark">🌿</span>
            Savor
        </a>
        <nav class="site-nav">
            <a href="./home.html">Home</a>
            <a href="./recipes.html">Recipes</a>
            <a href="./index.html" class="nav-cta" data-account-link data-profile-href="./profile.html">Sign in</a>
        </nav>
    </header>

    <main class="page-shell">
        <div class="page-heading">
            <div>
                <h1>All Recipes</h1>
                <p>Browse, search, and filter our growing collection.</p>
            </div>
        </div>

        <div class="toolbar">
            <input class="form-control" type="search" placeholder="Search recipes…" data-recipe-search>
            <select class="form-control" data-recipe-category>
                <option value="All">All categories</option>
                <option value="Vegetarian">Vegetarian</option>
                <option value="Vegan">Vegan</option>
                <option value="Breakfast">Breakfast</option>
            </select>
        </div>

        <p class="results-count" data-results-count></p>
        <div class="recipe-grid" data-recipe-grid></div>

        <div class="share-panel">
            <h2>Share your recipe</h2>
            <p>Have a recipe you love? Add it to the collection.</p>
            <form data-recipe-form>
                <div class="form-grid">
                    <div class="form-field">
                        <label for="r-title">Recipe name</label>
                        <input class="form-control" id="r-title" name="title" type="text" placeholder="e.g. Tomato &amp; Basil Pasta" required>
                    </div>
                    <div class="form-field">
                        <label for="r-category">Category</label>
                        <select class="form-control" id="r-category" name="category" required>
                            <option value="">Choose…</option>
                            <option value="Vegetarian">Vegetarian</option>
                            <option value="Vegan">Vegan</option>
                            <option value="Breakfast">Breakfast</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="r-time">Time (minutes)</label>
                        <input class="form-control" id="r-time" name="time" type="number" min="1" max="300" placeholder="30" required>
                    </div>
                    <div class="form-field">
                        <label for="r-difficulty">Difficulty</label>
                        <select class="form-control" id="r-difficulty" name="difficulty" required>
                            <option value="">Choose…</option>
                            <option value="Easy">Easy</option>
                            <option value="Medium">Medium</option>
                            <option value="Hard">Hard</option>
                        </select>
                    </div>
                    <div class="form-field form-field-wide">
                        <label for="r-description">Short description</label>
                        <input class="form-control" id="r-description" name="description" type="text" placeholder="One sentence about the dish" required>
                    </div>
                    <div class="form-field form-field-wide">
                        <label for="r-image">Image URL (optional)</label>
                        <input class="form-control" id="r-image" name="image" type="url" placeholder="https://…">
                    </div>
                    <div class="form-field form-field-wide">
                        <label for="r-ingredients">Ingredients (one per line)</label>
                        <textarea class="form-control" id="r-ingredients" name="ingredients" rows="4" placeholder="250 g pasta&#10;2 garlic cloves" required></textarea>
                    </div>
                    <div class="form-field form-field-wide">
                        <label for="r-steps">Method (one step per line)</label>
                        <textarea class="form-control" id="r-steps" name="steps" rows="5" placeholder="Boil the pasta…&#10;Add the sauce…" required></textarea>
                    </div>
                </div>
                <div class="form-actions">
                    <button class="button" type="submit">Add recipe</button>
                    <p class="form-message" data-form-message></p>
                </div>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <p>© 2026 Savor · Made with ❤️ for healthy eating</p>
    </footer>

    <dialog class="dialog" id="recipe-dialog"></dialog>
    <script src="./assets/js/app.js"></script>
</body>
</html>
